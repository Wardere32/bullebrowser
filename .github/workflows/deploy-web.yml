name: deploy-web

# Builds the Next.js landing page as a static export and publishes it to
# GitHub Pages. No third-party host required.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  # The download manifest is baked into the static export at build time from the
  # releases API, so the site keeps advertising whatever was newest the last
  # time this ran — that is how it served an un-notarized v0.2.13 for ten days
  # after v0.2.16 shipped.
  #
  # This must key off build-desktop *completing*, not `release: published`:
  #   1. The release is created with GITHUB_TOKEN, and GitHub deliberately does
  #      not start new workflow runs from GITHUB_TOKEN-raised events, so a
  #      `release` trigger here never fires at all.
  #   2. `published` fires when the release is created, while its assets are
  #      still uploading. A 126 MB Intel DMG loses that race, and the manifest
  #      bakes an asset list with no Intel download in it.
  # workflow_run fires after the entire build workflow — uploads included.
  workflow_run:
    workflows: [build-desktop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    # A failed build publishes nothing, so there is no new release to advertise
    # — redeploying on it would just be churn. Any other trigger runs normally.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 reads the version from the
      # root package.json's "packageManager" field. Setting both fails the
      # step with ERR_PNPM_BAD_PM_VERSION, which is why every deploy run
      # since this workflow last set version: 9 has aborted before build.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @bullebrowser/web typecheck

      # Served at the custom domain bullebrowser.com — apps/web/public/CNAME
      # carries the domain into the published artifact and the DNS is pointed
      # at GitHub Pages, so assets/links resolve at the domain root (no base
      # path). To revert to the project URL (wardere83.github.io/bullebrowser),
      # remove the CNAME and set NEXT_PUBLIC_BASE_PATH=/bullebrowser here.
      - name: Build static export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @bullebrowser/web build

      # enablement: true turns GitHub Pages ON automatically (build type =
      # GitHub Actions) if it isn't already — no manual Settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
