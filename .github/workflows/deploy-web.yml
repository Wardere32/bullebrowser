name: deploy-web

# Builds the Next.js landing page as a static export and publishes it to
# GitHub Pages. No third-party host required.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/brand-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @bullebrowser/web typecheck

      # Build at the site root for the bullebrowser.com custom domain (the
      # public/CNAME file pins it). To preview at the project Pages URL
      # instead, delete public/CNAME and set NEXT_PUBLIC_BASE_PATH=/bullebrowser.
      - name: Build static export
        run: pnpm --filter @bullebrowser/web build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
